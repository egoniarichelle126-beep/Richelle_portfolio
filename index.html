<!DOCTYPE html><html><head><title>Mirren Academy Dashboard</title><link rel="stylesheet" href="style.css"></head><body><div class="container"><div class="header-banner"><h1>Mirren Academy</h1><p>Student Management Dashboard</p></div><div class="stats-section"><div class="stat-card"><h3>Total Students</h3><h2 id="totalStudents">0</h2></div><div class="stat-card"><h3>Total Courses</h3><h2 id="totalCourses">0</h2></div></div><div class="card"><h2>Student Information</h2><form id="studentForm"><input type="text" id="studentId" placeholder="Student ID" required><input type="text" id="fullName" placeholder="Full Name" required><input type="text" id="course" placeholder="Course" required><select id="yearLevel" required><option value="" disabled selected>Select Year Level</option><option value="1st Year">1st Year</option><option value="2nd Year">2nd Year</option><option value="3rd Year">3rd Year</option><option value="4th Year">4th Year</option></select><input type="email" id="emailAddress" placeholder="Email Address" required><button type="submit">Add Student</button></form></div><div class="card"><h2>Student Records</h2><input type="text" id="searchStudent" placeholder="Search student..."><div class="table-responsive"><table id="studentTable"><thead><tr><th>Student ID</th><th>Name</th><th>Course</th><th>Year</th><th>Action</th></tr></thead><tbody id="studentTableBody"></tbody></table></div></div></div><script src="app.js"></script></body></html>
